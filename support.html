<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Support — FlatKhoj</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#fff; --bg2:#f7f7f5; --bg3:#f0efec;
  --ink:#141414; --ink2:#444; --ink3:#888; --border:#e8e8e4;
  --teal:#0f7b6c; --teal-bg:#e8f5f3; --teal-dark:#0a6358;
  --gold:#e6a817; --gold-bg:#fef6e4;
  --red:#d93025; --red-bg:#fce8e6;
  --radius:14px; --font:'Plus Jakarta Sans',sans-serif;
}
body { font-family:var(--font); background:var(--bg2); color:var(--ink); max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

/* TOPBAR */
.topbar { display:flex; align-items:center; padding:0 16px; height:52px; background:var(--bg); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; gap:12px; flex-shrink:0; }
.back-btn { background:none; border:none; cursor:pointer; color:var(--ink2); font-size:22px; padding:4px; }
.topbar-title { flex:1; font-size:16px; font-weight:700; }
.new-chat-btn { background:var(--teal-bg); color:var(--teal); border:none; border-radius:8px; padding:6px 12px; font-family:var(--font); font-size:13px; font-weight:700; cursor:pointer; }

/* SCREENS */
.screen { display:none; flex:1; flex-direction:column; overflow:hidden; }
.screen.active { display:flex; }

/* CONVERSATIONS LIST */
.conv-list { flex:1; overflow-y:auto; padding:12px 16px; }
.conv-card { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; cursor:pointer; }
.conv-card:active { background:var(--bg2); }
.conv-subject { font-size:14px; font-weight:700; color:var(--ink); margin-bottom:4px; }
.conv-preview { font-size:13px; color:var(--ink3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:6px; }
.conv-meta { display:flex; justify-content:space-between; align-items:center; }
.conv-time { font-size:11px; color:var(--ink3); }
.conv-status { font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; }
.conv-status.open { background:var(--teal-bg); color:var(--teal); }
.conv-status.resolved { background:var(--bg3); color:var(--ink3); }

/* NEW CONVERSATION */
.new-conv-wrap { flex:1; overflow-y:auto; padding:16px; }
.field-label { font-size:13px; font-weight:700; color:var(--ink2); margin-bottom:8px; }
.subject-input { width:100%; padding:13px 14px; border:2px solid var(--border); border-radius:12px; font-family:var(--font); font-size:15px; color:var(--ink); background:var(--bg); outline:none; margin-bottom:16px; }
.subject-input:focus { border-color:var(--teal); }
.topics-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:20px; }
.topic-btn { padding:12px; background:var(--bg); border:2px solid var(--border); border-radius:12px; font-family:var(--font); font-size:13px; font-weight:600; color:var(--ink2); cursor:pointer; text-align:left; }
.topic-btn.selected { border-color:var(--teal); background:var(--teal-bg); color:var(--teal); }
.msg-input-area { width:100%; padding:13px 14px; border:2px solid var(--border); border-radius:12px; font-family:var(--font); font-size:14px; color:var(--ink); background:var(--bg); outline:none; resize:none; min-height:120px; line-height:1.6; }
.msg-input-area:focus { border-color:var(--teal); }
.start-btn { width:100%; padding:15px; background:var(--teal); color:white; border:none; border-radius:var(--radius); font-family:var(--font); font-size:16px; font-weight:700; cursor:pointer; margin-top:16px; }
.start-btn:disabled { background:var(--bg3); color:var(--ink3); cursor:not-allowed; }

/* CHAT */
.chat-topbar { display:flex; align-items:center; padding:0 16px; height:52px; background:var(--bg); border-bottom:1px solid var(--border); gap:12px; flex-shrink:0; }
.chat-title { flex:1; }
.chat-subject { font-size:15px; font-weight:700; color:var(--ink); }
.chat-status-label { font-size:11px; color:var(--ink3); }
.chat-messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
.msg-bubble { max-width:80%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.5; }
.msg-bubble.user { background:var(--teal); color:white; align-self:flex-end; border-bottom-right-radius:4px; }
.msg-bubble.admin { background:var(--bg); border:1px solid var(--border); color:var(--ink); align-self:flex-start; border-bottom-left-radius:4px; }
.msg-time { font-size:10px; opacity:0.6; margin-top:4px; }
.msg-sender { font-size:11px; font-weight:700; color:var(--teal); margin-bottom:2px; }
.chat-input-bar { padding:10px 16px; background:var(--bg); border-top:1px solid var(--border); display:flex; gap:10px; align-items:flex-end; flex-shrink:0; }
.chat-input { flex:1; padding:11px 14px; border:2px solid var(--border); border-radius:12px; font-family:var(--font); font-size:14px; color:var(--ink); background:var(--bg2); outline:none; resize:none; max-height:100px; line-height:1.5; }
.chat-input:focus { border-color:var(--teal); background:var(--bg); }
.send-btn { width:42px; height:42px; background:var(--teal); color:white; border:none; border-radius:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.send-btn:disabled { background:var(--bg3); cursor:not-allowed; }

/* EMPTY STATE */
.empty-state { text-align:center; padding:60px 20px; }
.empty-icon { font-size:56px; margin-bottom:16px; }
.empty-title { font-size:18px; font-weight:700; margin-bottom:8px; }
.empty-sub { font-size:14px; color:var(--ink3); line-height:1.6; margin-bottom:24px; }
.start-support-btn { background:var(--teal); color:white; border:none; border-radius:var(--radius); padding:14px 28px; font-family:var(--font); font-size:15px; font-weight:700; cursor:pointer; }

/* BOTTOM NAV */
.bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--bg); border-top:1px solid var(--border); display:flex; z-index:100; flex-shrink:0; }
.nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 4px 8px; background:none; border:none; cursor:pointer; font-family:var(--font); font-size:10px; font-weight:600; color:var(--ink3); }
.nav-item.active { color:var(--teal); }
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar" id="mainTopbar">
  <button class="back-btn" onclick="goBack()">←</button>
  <div class="topbar-title" id="topbarTitle">Support</div>
  <button class="new-chat-btn" id="newChatBtn" onclick="showNewConv()" style="display:none">+ New chat</button>
</header>

<!-- SCREEN 1: CONVERSATIONS LIST -->
<div class="screen active" id="screen-list">
  <div class="conv-list" id="convList">
    <div style="text-align:center;padding:40px;color:var(--ink3);font-size:14px">Loading…</div>
  </div>
</div>

<!-- SCREEN 2: NEW CONVERSATION -->
<div class="screen" id="screen-new">
  <div class="new-conv-wrap">
    <div class="field-label">What do you need help with?</div>
    <div class="topics-grid">
      <button class="topic-btn" onclick="selectTopic(this, 'Coin balance issue')">🪙 Coin balance issue</button>
      <button class="topic-btn" onclick="selectTopic(this, 'Payment not working')">💳 Payment not working</button>
      <button class="topic-btn" onclick="selectTopic(this, 'Listing issue')">📋 Listing issue</button>
      <button class="topic-btn" onclick="selectTopic(this, 'Contact unlock issue')">🔓 Contact unlock issue</button>
      <button class="topic-btn" onclick="selectTopic(this, 'Account issue')">👤 Account issue</button>
      <button class="topic-btn" onclick="selectTopic(this, 'Other')">💬 Other</button>
    </div>
    <div class="field-label">Describe your issue</div>
    <textarea class="msg-input-area" id="firstMessage" placeholder="Tell us what's happening. The more detail you share, the faster we can help!" oninput="checkStartBtn()"></textarea>
    <button class="start-btn" id="startBtn" onclick="startConversation()" disabled>Send message →</button>
  </div>
</div>

<!-- SCREEN 3: CHAT -->
<div class="screen" id="screen-chat" style="padding-bottom:70px">
  <div class="chat-topbar" id="chatTopbar">
    <button class="back-btn" onclick="showList()">←</button>
    <div class="chat-title">
      <div class="chat-subject" id="chatSubject">Support</div>
      <div class="chat-status-label">We'll respond as soon as possible</div>
    </div>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-bar">
    <textarea class="chat-input" id="chatInput" placeholder="Type your message…" rows="1" oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item" onclick="window.location.href='index.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Home
  </button>
  <button class="nav-item" onclick="window.location.href='post_form.html'">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
    Post
  </button>
  <button class="nav-item" onclick="window.location.href='saved.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    Saved
  </button>
  <button class="nav-item active">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    Support
  </button>
  <button class="nav-item" onclick="window.location.href='activity.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    My Activity
  </button>
</nav>

<script>
const SUPA_URL = 'https://hbvdboxyppsmcuqgbpwp.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhidmRib3h5cHBzbWN1cWdicHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNTIxMzUsImV4cCI6MjA4OTcyODEzNX0.h0qTsmhwSUBREHfHUx-Wxdkk12Tg58qnVwwkb-AHui4';

function getUser() { try { return JSON.parse(localStorage.getItem('fmh_user')); } catch(e) { return null; } }

let selectedTopic = '';
let currentConvId = null;
let pollInterval = null;

// ── INIT ──────────────────────────────────────────────────
window.onload = async function() {
  const user = getUser();
  if (!user) { window.location.href = 'login.html?trigger=support'; return; }
  loadConversations(user);
};

// ── SCREENS ───────────────────────────────────────────────
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}

function showList() {
  stopPolling();
  currentConvId = null;
  document.getElementById('topbarTitle').textContent = 'Support';
  document.getElementById('newChatBtn').style.display = '';
  document.getElementById('mainTopbar').style.display = '';
  showScreen('list');
  loadConversations(getUser());
}

function showNewConv() {
  document.getElementById('topbarTitle').textContent = 'New conversation';
  document.getElementById('newChatBtn').style.display = 'none';
  showScreen('new');
}

function showChat(convId, subject) {
  currentConvId = convId;
  document.getElementById('chatSubject').textContent = subject;
  document.getElementById('mainTopbar').style.display = 'none';
  showScreen('chat');
  loadMessages(convId);
  startPolling(convId);
}

function goBack() {
  const activeScreen = document.querySelector('.screen.active')?.id;
  if (activeScreen === 'screen-new') { showList(); return; }
  window.location.href = 'index.html';
}

// ── LOAD CONVERSATIONS ─────────────────────────────────────
async function loadConversations(user) {
  const wrap = document.getElementById('convList');
  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/support_conversations?user_id=eq.${user.userId}&order=updated_at.desc`, {
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
    });
    const convs = await res.json();

    document.getElementById('newChatBtn').style.display = 'block';

    if (!Array.isArray(convs) || convs.length === 0) {
      wrap.innerHTML = `<div class="empty-state">
        <div class="empty-icon">💬</div>
        <div class="empty-title">No conversations yet</div>
        <div class="empty-sub">Have a question or facing an issue? Start a conversation and we'll get back to you soon.</div>
        <button class="start-support-btn" onclick="showNewConv()">Start a conversation →</button>
      </div>`;
      return;
    }

    // Get last message for each conversation
    wrap.innerHTML = '';
    for (const conv of convs) {
      const msgRes = await fetch(`${SUPA_URL}/rest/v1/support_messages?conversation_id=eq.${conv.id}&order=created_at.desc&limit=1`, {
        headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
      });
      const msgs = await msgRes.json();
      const lastMsg = msgs[0];

      const div = document.createElement('div');
      div.className = 'conv-card';
      div.onclick = () => showChat(conv.id, conv.subject);
      div.innerHTML = `
        <div class="conv-subject">${conv.subject}</div>
        <div class="conv-preview">${lastMsg ? (lastMsg.sender === 'admin' ? '← ' : 'You: ') + lastMsg.message : 'No messages yet'}</div>
        <div class="conv-meta">
          <span class="conv-time">${timeAgo(conv.updated_at)}</span>
          <span class="conv-status ${conv.status}">${conv.status === 'resolved' ? '✓ Resolved' : '● Open'}</span>
        </div>
      `;
      wrap.appendChild(div);
    }
  } catch(e) {
    wrap.innerHTML = '<div style="padding:40px;text-align:center;color:var(--ink3)">Could not load conversations</div>';
  }
}

// ── NEW CONVERSATION ───────────────────────────────────────
function selectTopic(btn, topic) {
  document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedTopic = topic;
  document.getElementById('firstMessage').placeholder = `Tell us about your ${topic.toLowerCase()}…`;
  checkStartBtn();
}

function checkStartBtn() {
  const msg = document.getElementById('firstMessage').value.trim();
  document.getElementById('startBtn').disabled = !selectedTopic || msg.length < 5;
}

async function startConversation() {
  const user = getUser();
  if (!user) return;
  const msg = document.getElementById('firstMessage').value.trim();
  if (!selectedTopic || msg.length < 5) return;

  const btn = document.getElementById('startBtn');
  btn.textContent = 'Starting…'; btn.disabled = true;

  try {
    // Create conversation
    const convRes = await fetch(`${SUPA_URL}/rest/v1/support_conversations`, {
      method: 'POST',
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
      body: JSON.stringify({ user_id: user.userId, user_phone: user.phone, subject: selectedTopic, status: 'open', created_at: new Date().toISOString(), updated_at: new Date().toISOString() })
    });
    const convData = await convRes.json();
    const convId = convData[0]?.id;
    if (!convId) throw new Error('No conversation ID');

    // Send first message
    await fetch(`${SUPA_URL}/rest/v1/support_messages`, {
      method: 'POST',
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversation_id: convId, sender: 'user', message: msg, created_at: new Date().toISOString() })
    });

    // Reset form
    selectedTopic = '';
    document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('firstMessage').value = '';
    btn.textContent = 'Send message →';

    // Open chat
    showChat(convId, selectedTopic || 'Support');

  } catch(e) {
    btn.textContent = 'Send message →'; btn.disabled = false;
    alert('Failed to start conversation. Please try again.');
  }
}

// ── CHAT ──────────────────────────────────────────────────
async function loadMessages(convId) {
  const wrap = document.getElementById('chatMessages');
  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/support_messages?conversation_id=eq.${convId}&order=created_at.asc`, {
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
    });
    const msgs = await res.json();
    wrap.innerHTML = '';

    if (msgs.length === 0) {
      wrap.innerHTML = '<div style="text-align:center;padding:20px;font-size:13px;color:var(--ink3)">No messages yet</div>';
      return;
    }

    msgs.forEach(m => appendMessage(m));
    wrap.scrollTop = wrap.scrollHeight;
  } catch(e) {}
}

function appendMessage(m) {
  const wrap = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.style.display = 'flex';
  div.style.flexDirection = 'column';
  div.style.alignItems = m.sender === 'user' ? 'flex-end' : 'flex-start';
  div.innerHTML = `
    ${m.sender === 'admin' ? '<div class="msg-sender">FlatKhoj Support</div>' : ''}
    <div class="msg-bubble ${m.sender}">${escHtml(m.message)}</div>
    <div class="msg-time" style="text-align:${m.sender === 'user' ? 'right' : 'left'}">${timeAgo(m.created_at)}</div>
  `;
  wrap.appendChild(div);
}

async function sendMessage() {
  const user = getUser();
  if (!user || !currentConvId) return;
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  input.value = '';
  input.style.height = '';

  try {
    await fetch(`${SUPA_URL}/rest/v1/support_messages`, {
      method: 'POST',
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversation_id: currentConvId, sender: 'user', message: msg, created_at: new Date().toISOString() })
    });

    // Update conversation timestamp
    await fetch(`${SUPA_URL}/rest/v1/support_conversations?id=eq.${currentConvId}`, {
      method: 'PATCH',
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ updated_at: new Date().toISOString() })
    });

    // Append optimistically
    appendMessage({ sender: 'user', message: msg, created_at: new Date().toISOString() });
    document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;

  } catch(e) {
    input.value = msg; // restore on failure
    alert('Failed to send. Please try again.');
  }
  btn.disabled = false;
}

// Poll for new messages every 10 seconds
function startPolling(convId) {
  stopPolling();
  pollInterval = setInterval(() => loadMessages(convId), 10000);
}
function stopPolling() {
  if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function autoResize(el) { el.style.height = ''; el.style.height = Math.min(el.scrollHeight, 100) + 'px'; }
function escHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function timeAgo(d) {
  const diff = Date.now() - new Date(d).getTime();
  const m = Math.floor(diff/60000);
  if(m<1) return 'just now';
  if(m<60) return m+'m ago';
  const h = Math.floor(m/60);
  if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
</script>
</body>
</html>
