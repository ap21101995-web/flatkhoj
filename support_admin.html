<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Support Admin — FlatKhoj</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#fff; --bg2:#f7f7f5; --bg3:#f0efec;
  --ink:#141414; --ink2:#444; --ink3:#888; --border:#e8e8e4;
  --teal:#0f7b6c; --teal-bg:#e8f5f3;
  --gold:#e6a817; --gold-bg:#fef6e4;
  --red:#d93025; --red-bg:#fce8e6;
  --radius:14px; --font:'Plus Jakarta Sans',sans-serif;
}
body { font-family:var(--font); background:var(--bg2); color:var(--ink); max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
.topbar { display:flex; align-items:center; padding:0 16px; height:52px; background:var(--teal); gap:12px; flex-shrink:0; }
.back-btn { background:none; border:none; cursor:pointer; color:white; font-size:22px; padding:4px; }
.topbar-title { flex:1; font-size:16px; font-weight:700; color:white; }
.screen { display:none; flex:1; flex-direction:column; overflow:hidden; }
.screen.active { display:flex; }
.conv-list { flex:1; overflow-y:auto; padding:12px 16px; }
.conv-card { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; cursor:pointer; }
.conv-card:active { background:var(--bg2); }
.conv-card.unread { border-left:4px solid var(--teal); }
.conv-phone { font-size:12px; color:var(--teal); font-weight:700; margin-bottom:2px; }
.conv-subject { font-size:14px; font-weight:700; color:var(--ink); margin-bottom:4px; }
.conv-preview { font-size:13px; color:var(--ink3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:6px; }
.conv-meta { display:flex; justify-content:space-between; align-items:center; }
.conv-time { font-size:11px; color:var(--ink3); }
.conv-status { font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; }
.conv-status.open { background:var(--teal-bg); color:var(--teal); }
.conv-status.resolved { background:var(--bg3); color:var(--ink3); }
.chat-topbar { display:flex; align-items:center; padding:0 16px; height:52px; background:var(--teal); gap:12px; flex-shrink:0; }
.chat-info { flex:1; }
.chat-phone { font-size:13px; color:rgba(255,255,255,0.8); }
.chat-subject-label { font-size:15px; font-weight:700; color:white; }
.resolve-btn { background:rgba(255,255,255,0.2); color:white; border:1px solid rgba(255,255,255,0.3); border-radius:8px; padding:6px 12px; font-family:var(--font); font-size:12px; font-weight:700; cursor:pointer; }
.chat-messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
.msg-bubble { max-width:80%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.5; }
.msg-bubble.user { background:var(--bg3); color:var(--ink); align-self:flex-start; border-bottom-left-radius:4px; }
.msg-bubble.admin { background:var(--teal); color:white; align-self:flex-end; border-bottom-right-radius:4px; }
.msg-time { font-size:10px; opacity:0.6; margin-top:4px; }
.msg-sender { font-size:11px; font-weight:700; color:var(--ink3); margin-bottom:2px; }
.chat-input-bar { padding:10px 16px; background:var(--bg); border-top:1px solid var(--border); display:flex; gap:10px; align-items:flex-end; flex-shrink:0; }
.chat-input { flex:1; padding:11px 14px; border:2px solid var(--border); border-radius:12px; font-family:var(--font); font-size:14px; color:var(--ink); background:var(--bg2); outline:none; resize:none; max-height:100px; line-height:1.5; }
.chat-input:focus { border-color:var(--teal); background:var(--bg); }
.send-btn { width:42px; height:42px; background:var(--teal); color:white; border:none; border-radius:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.tab-bar { display:flex; border-bottom:1px solid var(--border); background:var(--bg); }
.tab { flex:1; padding:12px; text-align:center; font-size:13px; font-weight:700; color:var(--ink3); cursor:pointer; border-bottom:2px solid transparent; }
.tab.active { color:var(--teal); border-bottom-color:var(--teal); }
.empty { text-align:center; padding:40px; color:var(--ink3); font-size:14px; }
</style>
</head>
<body>

<header class="topbar" id="mainTopbar">
  <div class="topbar-title">🛠 Support Admin</div>
</header>

<!-- SCREEN 1: LIST -->
<div class="screen active" id="screen-list">
  <div class="tab-bar">
    <div class="tab active" onclick="setTab('open', this)">Open</div>
    <div class="tab" onclick="setTab('resolved', this)">Resolved</div>
  </div>
  <div class="conv-list" id="convList">
    <div style="text-align:center;padding:40px;color:var(--ink3)">Loading…</div>
  </div>
</div>

<!-- SCREEN 2: CHAT -->
<div class="screen" id="screen-chat" style="padding-bottom:0">
  <div class="chat-topbar">
    <button class="back-btn" onclick="showList()">←</button>
    <div class="chat-info">
      <div class="chat-phone" id="chatPhone"></div>
      <div class="chat-subject-label" id="chatSubject">Support</div>
    </div>
    <button class="resolve-btn" id="resolveBtn" onclick="toggleResolve()">Mark resolved</button>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-bar">
    <textarea class="chat-input" id="chatInput" placeholder="Reply to user…" rows="1" oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
    <button class="send-btn" onclick="sendReply()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script>
const SUPA_URL = 'https://hbvdboxyppsmcuqgbpwp.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhidmRib3h5cHBzbWN1cWdicHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNTIxMzUsImV4cCI6MjA4OTcyODEzNX0.h0qTsmhwSUBREHfHUx-Wxdkk12Tg58qnVwwkb-AHui4';

// Admin check
function getUser() { try { return JSON.parse(localStorage.getItem('fmh_user')); } catch(e) { return null; } }
window.onload = function() {
  const user = getUser();
  if (!user || (!user.isOwner && user.phone !== '9538584612')) {
    document.body.innerHTML = '<div style="padding:40px;text-align:center;font-size:16px;color:#888">Access denied</div>';
    return;
  }
  loadConversations('open');
};

let currentConvId = null;
let currentStatus = 'open';
let currentTab = 'open';
let pollInterval = null;

function setTab(status, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentTab = status;
  loadConversations(status);
}

async function loadConversations(status) {
  const wrap = document.getElementById('convList');
  wrap.innerHTML = '<div style="text-align:center;padding:40px;color:var(--ink3)">Loading…</div>';
  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/support_conversations?status=eq.${status}&order=updated_at.desc`, {
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
    });
    const convs = await res.json();
    if (!Array.isArray(convs) || convs.length === 0) {
      wrap.innerHTML = `<div class="empty">No ${status} conversations</div>`; return;
    }
    wrap.innerHTML = '';
    for (const conv of convs) {
      const msgRes = await fetch(`${SUPA_URL}/rest/v1/support_messages?conversation_id=eq.${conv.id}&order=created_at.desc&limit=1`, {
        headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
      });
      const msgs = await msgRes.json();
      const lastMsg = msgs[0];
      const isUnread = lastMsg?.sender === 'user';
      const div = document.createElement('div');
      div.className = 'conv-card' + (isUnread ? ' unread' : '');
      div.onclick = () => openChat(conv);
      div.innerHTML = `
        <div class="conv-phone">+91 ${conv.user_phone}</div>
        <div class="conv-subject">${conv.subject}</div>
        <div class="conv-preview">${lastMsg ? (lastMsg.sender === 'admin' ? 'You: ' : 'User: ') + lastMsg.message : 'No messages'}</div>
        <div class="conv-meta">
          <span class="conv-time">${timeAgo(conv.updated_at)}</span>
          <span class="conv-status ${conv.status}">${conv.status === 'resolved' ? '✓ Resolved' : '● Open'}</span>
        </div>`;
      wrap.appendChild(div);
    }
  } catch(e) { wrap.innerHTML = '<div class="empty">Failed to load</div>'; }
}

function showList() {
  if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
  document.getElementById('mainTopbar').style.display = '';
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-list').classList.add('active');
  loadConversations(currentTab);
}

function openChat(conv) {
  currentConvId = conv.id;
  currentStatus = conv.status;
  document.getElementById('chatPhone').textContent = '+91 ' + conv.user_phone;
  document.getElementById('chatSubject').textContent = conv.subject;
  document.getElementById('resolveBtn').textContent = conv.status === 'resolved' ? 'Reopen' : 'Mark resolved';
  document.getElementById('mainTopbar').style.display = 'none';
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-chat').classList.add('active');
  loadMessages(conv.id);
  pollInterval = setInterval(() => loadMessages(conv.id), 8000);
}

async function loadMessages(convId) {
  const wrap = document.getElementById('chatMessages');
  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/support_messages?conversation_id=eq.${convId}&order=created_at.asc`, {
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
    });
    const msgs = await res.json();
    const wasAtBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 60;
    wrap.innerHTML = '';
    msgs.forEach(m => {
      const div = document.createElement('div');
      div.style.cssText = `display:flex;flex-direction:column;align-items:${m.sender === 'admin' ? 'flex-end' : 'flex-start'}`;
      div.innerHTML = `
        ${m.sender === 'user' ? '<div class="msg-sender">User</div>' : ''}
        <div class="msg-bubble ${m.sender}">${escHtml(m.message)}</div>
        <div class="msg-time" style="text-align:${m.sender === 'admin' ? 'right' : 'left'}">${timeAgo(m.created_at)}</div>`;
      wrap.appendChild(div);
    });
    if (wasAtBottom) wrap.scrollTop = wrap.scrollHeight;
  } catch(e) {}
}

async function sendReply() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg || !currentConvId) return;
  input.value = ''; input.style.height = '';
  try {
    await fetch(`${SUPA_URL}/rest/v1/support_messages`, {
      method: 'POST',
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversation_id: currentConvId, sender: 'admin', message: msg, created_at: new Date().toISOString() })
    });
    await fetch(`${SUPA_URL}/rest/v1/support_conversations?id=eq.${currentConvId}`, {
      method: 'PATCH',
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ updated_at: new Date().toISOString() })
    });
    loadMessages(currentConvId);
  } catch(e) { input.value = msg; alert('Failed to send.'); }
}

async function toggleResolve() {
  const newStatus = currentStatus === 'resolved' ? 'open' : 'resolved';
  try {
    await fetch(`${SUPA_URL}/rest/v1/support_conversations?id=eq.${currentConvId}`, {
      method: 'PATCH',
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: newStatus, updated_at: new Date().toISOString() })
    });
    currentStatus = newStatus;
    document.getElementById('resolveBtn').textContent = newStatus === 'resolved' ? 'Reopen' : 'Mark resolved';
  } catch(e) { alert('Failed to update status.'); }
}

function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); } }
function autoResize(el) { el.style.height = ''; el.style.height = Math.min(el.scrollHeight, 100) + 'px'; }
function escHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function timeAgo(d) {
  const diff = Date.now() - new Date(d).getTime();
  const m = Math.floor(diff/60000);
  if(m<1) return 'just now';
  if(m<60) return m+'m ago';
  const h = Math.floor(m/60);
  if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
</script>
</body>
</html>
