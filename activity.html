<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#fff; --bg2:#f7f7f5; --bg3:#f0efec;
  --ink:#141414; --ink2:#444; --ink3:#888; --border:#e8e8e4;
  --teal:#0f7b6c; --teal-bg:#e8f5f3; --teal-dark:#0a6358;
  --gold:#e6a817; --gold-bg:#fef6e4;
  --red:#d93025; --red-bg:#fce8e6;
  --radius:14px; --font:'Plus Jakarta Sans',sans-serif;
}
body { font-family:var(--font); background:var(--bg2); color:var(--ink); max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:80px; }

.topbar { display:flex; align-items:center; padding:0 16px; height:52px; background:var(--bg); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; gap:12px; }
.back-btn { background:none; border:none; cursor:pointer; color:var(--ink2); font-size:22px; padding:4px; }
.topbar-title { flex:1; font-size:16px; font-weight:700; }

/* COIN BALANCE CARD */
.balance-card {
  margin:16px; background:linear-gradient(135deg,#0f7b6c,#13a090);
  border-radius:var(--radius); padding:20px; color:white; position:relative; overflow:hidden;
}
.balance-card::before { content:''; position:absolute; top:-20px; right:-20px; width:100px; height:100px; background:rgba(255,255,255,0.08); border-radius:50%; }
.balance-label { font-size:13px; opacity:0.8; margin-bottom:6px; }
.balance-amount { font-size:38px; font-weight:800; letter-spacing:-1px; }
.balance-sub { font-size:12px; opacity:0.7; margin-top:4px; }
.buy-coins-btn {
  display:block; margin:0 16px 16px; padding:15px;
  background:var(--gold); color:white; border:none; border-radius:var(--radius);
  font-family:var(--font); font-size:16px; font-weight:700; cursor:pointer;
  text-align:center; text-decoration:none; width:calc(100% - 32px);
  box-shadow:0 4px 12px rgba(230,168,23,0.4);
}
.buy-coins-btn:active { background:#c9921a; }

/* SECTIONS */
.section-heading { font-size:13px; font-weight:700; color:var(--ink3); text-transform:uppercase; letter-spacing:0.5px; padding:20px 16px 10px; }

/* LISTING CARDS */
.activity-card {
  background:var(--bg); border:1px solid var(--border); border-radius:var(--radius);
  margin:0 16px 12px; padding:14px 16px; cursor:pointer;
}
.activity-card:active { background:var(--bg2); }
.activity-type { font-size:11px; font-weight:700; color:var(--teal); text-transform:uppercase; letter-spacing:0.3px; margin-bottom:4px; }
.activity-title { font-size:15px; font-weight:700; color:var(--ink); margin-bottom:4px; line-height:1.3; }
.activity-meta { font-size:12px; color:var(--ink3); display:flex; gap:12px; align-items:center; }
.activity-tag { background:var(--bg2); border-radius:6px; padding:3px 8px; font-size:11px; font-weight:600; }

/* EMPTY STATE */
.empty-state { text-align:center; padding:40px 20px; }
.empty-icon { font-size:48px; margin-bottom:12px; }
.empty-title { font-size:16px; font-weight:700; color:var(--ink); margin-bottom:6px; }
.empty-sub { font-size:13px; color:var(--ink3); margin-bottom:20px; line-height:1.6; }
.empty-btn { display:inline-block; background:var(--teal); color:white; border:none; border-radius:12px; padding:12px 24px; font-family:var(--font); font-size:14px; font-weight:700; cursor:pointer; text-decoration:none; }

/* LOGOUT */
.logout-btn { display:block; margin:24px 16px 0; padding:14px; background:none; border:1.5px solid var(--border); border-radius:var(--radius); font-family:var(--font); font-size:14px; font-weight:600; color:var(--ink3); cursor:pointer; width:calc(100% - 32px); text-align:center; }
.logout-btn:active { background:var(--bg2); }

/* BOTTOM NAV */
.bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--bg); border-top:1px solid var(--border); display:flex; z-index:100; }
.nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 4px 8px; background:none; border:none; cursor:pointer; font-family:var(--font); font-size:10px; font-weight:600; color:var(--ink3); }
.nav-item.active { color:var(--teal); }
</style>
</head>
<body>

<header class="topbar">
  <button class="back-btn" onclick="nav('index.html')">←</button>
  <div class="topbar-title">My Activity</div>
  <button onclick="logout()" style="background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-family:var(--font);font-size:12px;font-weight:600;color:var(--ink3);cursor:pointer">Sign out</button>
</header>

<!-- COIN BALANCE -->
<div class="balance-card">
  <div class="balance-label">Your coin balance</div>
  <div class="balance-amount" id="coinBalance">0 🪙</div>
  <div class="balance-sub">Use coins to unlock contacts</div>
</div>

<!-- BUY COINS -->
<a href="coins.html" class="buy-coins-btn">
  🪙 Buy More Coins
</a>

<!-- MY POSTS -->
<div class="section-heading">My Posts</div>
<div id="myPostsWrap">
  <div style="text-align:center;padding:20px;color:var(--ink3);font-size:14px">Loading…</div>
</div>

<!-- CONTACTS UNLOCKED -->
<div class="section-heading">Contacts Unlocked</div>
<div id="unlockedWrap">
  <div style="text-align:center;padding:20px;color:var(--ink3);font-size:14px">Loading…</div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item" onclick="nav('index.html')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Home
  </button>
  <button class="nav-item" onclick="nav('post_form.html')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
    Post
  </button>
  <button class="nav-item" onclick="nav('saved.html')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    Saved
  </button>
  <button class="nav-item" onclick="nav('support.html')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    Support
  </button>
  <button class="nav-item active">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    My Activity
  </button>
</nav>

<script>
const SUPA_URL = 'https://hbvdboxyppsmcuqgbpwp.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhidmRib3h5cHBzbWN1cWdicHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNTIxMzUsImV4cCI6MjA4OTcyODEzNX0.h0qTsmhwSUBREHfHUx-Wxdkk12Tg58qnVwwkb-AHui4';

// ── COINS — single source of truth ────────────────────────
async function refreshCoins(forceDB = true) {
  const user = getUser();
  if (!user) return 0;
  let coins = user.coins || 0;
  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/users?id=eq.${user.userId}&select=coins`, {
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
    });
    const data = await res.json();
    if (data[0]?.coins !== undefined) {
      coins = data[0].coins;
      user.coins = coins;
      localStorage.setItem('fmh_user', JSON.stringify(user));
    }
  } catch(e) {}
  updateCoinDisplays(coins);
  return coins;
}

function updateCoinDisplays(coins) {
  // Nav badge (index)
  const navCount = document.getElementById('navCoinCount');
  if (navCount) { navCount.textContent = coins; }
  const navBadge = document.getElementById('navCoinBadge');
  if (navBadge) navBadge.style.display = getUser() ? 'flex' : 'none';

  // Unlock sheet balance (index + listing_detail)
  document.querySelectorAll('#unlockSheetBalance, #unlockCoinBalance').forEach(el => {
    el.textContent = '🪙 ' + coins + ' coins';
  });

  // Coin balance bar (listing_detail)
  const coinBalanceNum = document.getElementById('coinBalanceNum');
  if (coinBalanceNum) coinBalanceNum.textContent = '🪙 ' + coins;
  const coinBalanceBar = document.getElementById('coinBalanceBar');
  if (coinBalanceBar) coinBalanceBar.style.display = 'flex';

  // Activity page
  const coinBalanceEl = document.getElementById('coinBalance');
  if (coinBalanceEl) coinBalanceEl.textContent = coins + ' 🪙';
}

function getUser() { try { return JSON.parse(localStorage.getItem('fmh_user')); } catch(e) { return null; } }

const typeLabels = {
  flat_listing: '🏠 Full Flat Listing',
  flat_wanted: '🔍 Flat Wanted',
  flatmate_wanted: '👥 Flatmate Wanted',
  pg_listing: '🏨 PG Listing'
};

function timeAgo(d) {
  const diff = Date.now() - new Date(d).getTime();
  const m = Math.floor(diff/60000);
  if(m<60) return m+' mins ago';
  const h = Math.floor(m/60);
  if(h<24) return h+' hrs ago';
  return Math.floor(h/24)+' days ago';
}

window.onload = async function() {
  const user = getUser();
  if (!user) { nav('login.html?trigger=account'); return; }

  // Update fresh coin balance
  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/users?id=eq.${user.userId}&select=coins`, {
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
    });
    const data = await res.json();
    if (data && data[0]) {
      user.coins = data[0].coins || 0;
      localStorage.setItem('fmh_user', JSON.stringify(user));
    }
  } catch(e) {}

  document.getElementById('coinBalance').textContent = (user.coins || 0) + ' 🪙';

  // Load my posts
  loadMyPosts(user);

  // Load unlocked contacts
  loadUnlockedContacts(user);
};

async function loadMyPosts(user) {
  const wrap = document.getElementById('myPostsWrap');
  try {
    // Fetch both posts created by user AND posts claimed by user (posted on their behalf)
    const [myRes, claimedRes] = await Promise.all([
      fetch(`${SUPA_URL}/rest/v1/listings?user_id=eq.${user.userId}&order=created_at.desc&select=*`, {
        headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}`, 'Range': '0-9999' }
      }),
      fetch(`${SUPA_URL}/rest/v1/listings?claimed_by_user_id=eq.${user.userId}&order=created_at.desc&select=*`, {
        headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}`, 'Range': '0-9999' }
      })
    ]);

    const myPosts = await myRes.json();
    const claimedPosts = await claimedRes.json();

    // Merge and deduplicate
    const allIds = new Set();
    const posts = [];
    [...(Array.isArray(myPosts) ? myPosts : []), ...(Array.isArray(claimedPosts) ? claimedPosts : [])].forEach(p => {
      if (!allIds.has(p.id)) { allIds.add(p.id); posts.push(p); }
    });
    posts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

    if (posts.length === 0) {
      wrap.innerHTML = `<div class="empty-state">
        <div class="empty-icon">📋</div>
        <div class="empty-title">No posts yet</div>
        <div class="empty-sub">Post your first listing — it's free!</div>
        <a href="post_form.html" class="empty-btn">Post a listing →</a>
      </div>`;
      return;
    }
    wrap.innerHTML = '';
    posts.forEach(p => {
      const areas = Array.isArray(p.areas) ? p.areas.join(', ') : p.areas || 'Mumbai';
      const isClaimed = p.claimed_by_user_id === user.userId && p.user_id !== user.userId;
      const div = document.createElement('div');
      div.className = 'activity-card';
      div.onclick = () => window.location.href = 'listing_detail.html?id=' + p.id;
      div.innerHTML = `
        <div class="activity-type">${typeLabels[p.listing_type] || p.listing_type}${isClaimed ? ' <span style="background:var(--gold-bg);color:var(--gold);padding:2px 6px;border-radius:4px;font-size:10px">Added for you</span>' : ''}</div>
        <div class="activity-title">${p.description?.slice(0,80) || 'Listing in ' + areas}</div>
        <div class="activity-meta">
          <span>📍 ${areas}</span>
          ${p.rent_amount ? `<span>₹${p.rent_amount.toLocaleString('en-IN')}/mo</span>` : ''}
          <span>${timeAgo(p.created_at)}</span>
          <span class="activity-tag" style="background:${p.is_active ? 'var(--teal-bg)' : 'var(--red-bg)'}; color:${p.is_active ? 'var(--teal)' : 'var(--red)'}">${p.is_active ? 'Live' : 'Deleted'}</span>
        </div>`;
      wrap.appendChild(div);
    });
  } catch(e) {
    wrap.innerHTML = '<div style="padding:16px;text-align:center;color:var(--ink3);font-size:13px">Could not load posts</div>';
  }
}

async function loadUnlockedContacts(user) {
  const wrap = document.getElementById('unlockedWrap');
  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/contact_unlocks?unlocker_user_id=eq.${user.userId}&order=created_at.desc&select=*,listings(listing_type,areas,description,rent_amount,is_active,poster_name)`, {
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}`, 'Range': '0-9999' }
    });
    const unlocks = await res.json();
    if (!Array.isArray(unlocks) || unlocks.length === 0) {
      wrap.innerHTML = `<div class="empty-state">
        <div class="empty-icon">🔓</div>
        <div class="empty-title">No contacts unlocked yet</div>
        <div class="empty-sub">Browse listings and unlock contacts to connect with owners and tenants.</div>
        <a href="index.html" class="empty-btn">Browse listings →</a>
      </div>`;
      return;
    }
    wrap.innerHTML = '';
    unlocks.forEach(u => {
      const l = u.listings;
      // Show even if listing is deleted — user paid for it
      const areas = l ? (Array.isArray(l.areas) ? l.areas.join(', ') : l.areas || 'Mumbai') : 'Mumbai';
      const typeLabel = l ? (typeLabels[l.listing_type] || l.listing_type) : 'Listing';
      const description = l?.description?.slice(0,80) || 'Listing in ' + areas;
      const isDeleted = !l || l.is_active === false;
      // Skip deleted/expired listings entirely
      if (isDeleted) return;
      const div = document.createElement('div');
      div.className = 'activity-card';
      div.onclick = () => window.location.href = 'listing_detail.html?id=' + u.listing_id;
      div.innerHTML = `
        <div class="activity-type">${typeLabel}</div>
        <div class="activity-title">${description}</div>
        <div style="font-size:13px;color:var(--ink2);font-weight:600;margin:3px 0 4px">👤 ${l?.poster_name || 'FlatKhoj Member'}</div>
        <div class="activity-meta">
          <span>📍 ${areas}</span>
          ${l?.rent_amount ? `<span>₹${l.rent_amount.toLocaleString('en-IN')}/mo</span>` : ''}
          <span>${timeAgo(u.created_at)}</span>
          <span class="activity-tag" style="background:var(--teal-bg);color:var(--teal)">🔓 Unlocked</span>
          ${isDeleted ? '<span class="activity-tag" style="background:var(--red-bg);color:var(--red)">Expired</span>' : ''}
        </div>`;
      wrap.appendChild(div);
    });
  } catch(e) {
    wrap.innerHTML = '<div style="padding:16px;text-align:center;color:var(--ink3);font-size:13px">Could not load unlocked contacts</div>';
  }
}

function logout() {
  if (confirm('Are you sure you want to sign out?')) {
    localStorage.removeItem('fmh_user');
    localStorage.removeItem('fk_unlocked');
    nav('index.html');
  }
}

// Navigation helper — new tab on desktop, same tab on mobile
function nav(url, e) {
  const isDesktop = isDesktopDevice();
  if (e && (e.ctrlKey || e.metaKey || e.shiftKey)) { window.open(url, '_blank'); }
  else if (isDesktop) { window.open(url, '_blank'); }
  else { window.location.href = url; }
}
</script>
</body>
</html>
