    <div style="font-size:28px;margin-bottom:8px">🏠</div>
    <h2 style="font-size:20px;font-weight:700;color:#1a1a18;margin:0 0 6px">Select your city</h2>
    <p style="font-size:14px;color:#6b6b68;margin:0 0 24px">We'll show you listings in your city</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px" id="cityGrid">
      
      <button id="cityBtn-mumbai" onclick="setCity('mumbai')" style="border-radius:14px;padding:20px 12px;cursor:pointer;text-align:center;transition:all 0.15s">
        <div style="font-size:40px;margin-bottom:8px">🌉</div>
        <div style="font-size:16px;font-weight:700">Mumbai</div>
        <div style="font-size:11px;margin-top:2px">Financial Capital of India</div>
      </button>
      
      <button id="cityBtn-pune" onclick="handlePuneClick()" style="border-radius:14px;padding:20px 12px;cursor:pointer;text-align:center;opacity:0.45;background:#f5f0ff;border:2px solid #8b5cf6;position:relative">
        <div style="font-size:40px;margin-bottom:8px;">🏰</div>
        <div style="font-size:16px;font-weight:700;color:#7c3aed">Pune</div>
        <div id="puneLabel" style="font-size:11px;color:#7c3aed;margin-top:2px">Coming Soon</div>
        <div id="puneBadge" style="position:absolute;top:8px;right:8px;background:#ede9fe;color:#7c3aed;font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px">SOON</div>
      </button>
      <button id="cityBtn-bengaluru" onclick="handleBengaluruClick()" style="border-radius:14px;padding:20px 12px;cursor:pointer;text-align:center;opacity:0.45;background:#fff5e6;border:2px solid #f97316;position:relative">
        <div style="font-size:40px;margin-bottom:8px;">🌆</div>
        <div style="font-size:16px;font-weight:700;color:#f97316">Bengaluru</div>
        <div id="bengaluruLabel" style="font-size:11px;color:#f97316;margin-top:2px">Coming Soon</div>
        <div id="bengaluruBadge" style="position:absolute;top:8px;right:8px;background:#fff5e6;color:#f97316;font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px">SOON</div>
      </button>
    </div>
  </div>
</div>

<script>
function handleBengaluruClick(){
  try{
    var u=JSON.parse(localStorage.getItem('fmh_user')||'{}');
    var ph=String(u.phone||'').replace(/\D/g,'').slice(-10);
    if(ph==='9538584612'||ph==='9004325226'||u.isOwner===true||u.isOwner==='true'){
      setCity('bengaluru');
    } else {
      alert('Bengaluru is coming soon! Stay tuned.');
    }
  }catch(e){alert('Bengaluru is coming soon! Stay tuned.');}
}

function unlockBengaluruIfAdmin(){
  try{
    var u=JSON.parse(localStorage.getItem('fmh_user')||localStorage.getItem('fk_login_v2')||'{}');
    var ph=String(u.phone||'').replace(/\D/g,'').slice(-10);
    var isAdmin=ph==='9538584612'||ph==='9004325226'||u.isOwner===true||u.isOwner==='true';
    var btn=document.getElementById('cityBtn-bengaluru');
    if(!btn)return;
    if(isAdmin){
      btn.style.opacity='1';
      btn.style.background='#fff5e6';
      btn.style.border='2px solid #f97316';
      btn.style.cursor='pointer';
      btn.onclick=function(){setCity('bengaluru');};
      var lbl=document.getElementById('bengaluruLabel');
      if(lbl){lbl.textContent='Admin Preview';lbl.style.color='#f97316';}
      var badge=document.getElementById('bengaluruBadge');
      if(badge){badge.textContent='ADMIN';badge.style.background='#fff5e6';badge.style.color='#f97316';}
    }
  }catch(e){}
}
