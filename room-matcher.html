<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Matcher — Find Occupants for Empty Rooms | FlatKhoj</title>
<meta name="description" content="Have empty rooms in a flat? Mark which rooms and beds are vacant, and find real people already looking for exactly that.">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #f7f7f5;
    color: #141414;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 60px;
  }
  .topbar { display:flex; align-items:center; padding:14px 16px; background:#fff; border-bottom:1px solid #e8e8e4; }
  .logo { font-size:18px; font-weight:800; text-decoration:none; color:#141414; }
  .logo span { color:#0f7b6c; }

  .hero { padding: 22px 20px 16px; text-align: center; background: linear-gradient(180deg, #e8f5f3 0%, #f7f7f5 100%); }
  .hero-badge {
    display:inline-block; background:#0f7b6c; color:#fff; font-size:11px; font-weight:700;
    padding:5px 14px; border-radius:20px; letter-spacing:0.4px; text-transform:uppercase; margin-bottom:10px;
  }
  .hero h1 { font-size:21px; font-weight:800; line-height:1.3; margin-bottom:6px; }
  .hero p { font-size:13px; color:#555; line-height:1.5; }

  .section { padding: 16px 20px; }
  .setup-card { background:#fff; border:1.5px solid #e8e8e4; border-radius:16px; padding:16px; margin-bottom:16px; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .form-row.three { grid-template-columns:1fr 1fr 1fr; }
  .form-group label { display:block; font-size:11.5px; font-weight:700; color:#555; margin-bottom:5px; }
  .form-group input, .form-group select {
    width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid #e8e8e4;
    font-family:'Plus Jakarta Sans',sans-serif; font-size:13.5px; background:#fff; color:#141414;
  }

  /* ---- The house shape ---- */
  .house-wrap { display:flex; flex-direction:column; align-items:center; margin-top:4px; }
  .roof {
    width: 0; height: 0;
    border-left: 155px solid transparent;
    border-right: 155px solid transparent;
    border-bottom: 55px solid #0f7b6c;
  }
  .house-body {
    width: 100%; max-width: 310px; background:#fff; border:3px solid #0f7b6c; border-top:none;
    border-radius: 0 0 10px 10px; overflow:hidden;
  }

  .room-unit { border-bottom: 2px dashed #e8e8e4; }
  .room-unit:last-child { border-bottom:none; }

  .room-header {
    display:flex; align-items:center; justify-content:space-between; padding:14px 16px; cursor:pointer;
    background:#fafafa;
  }
  .room-header.is-vacant { background:#e8f5f3; }
  .room-header-left { display:flex; align-items:center; gap:8px; }
  .room-icon { font-size:16px; }
  .room-name { font-size:13.5px; font-weight:800; }
  .room-substatus { font-size:10.5px; color:#0f7b6c; font-weight:700; margin-top:2px; }

  .vacant-toggle {
    display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:#888;
  }
  .switch { position:relative; width:38px; height:21px; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; cursor:pointer; inset:0; background:#ccc; border-radius:20px; transition:0.2s; }
  .slider::before { content:""; position:absolute; height:15px; width:15px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:0.2s; }
  .switch input:checked + .slider { background:#0f7b6c; }
  .switch input:checked + .slider::before { transform: translateX(17px); }

  .room-details { padding:0 16px 16px; display:none; }
  .room-details.open { display:block; }

  .occ-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:10px 0; }
  .occ-btn {
    padding:8px 3px; border-radius:8px; border:1.5px solid #e8e8e4; background:#fff;
    font-size:11px; font-weight:700; cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif; color:#666;
  }
  .occ-btn.sel { border-color:#0f7b6c; background:#0f7b6c; color:#fff; }

  .beds-row { display:flex; gap:8px; margin:10px 0; flex-wrap:wrap; }
  .bed-chip {
    flex:1; min-width:70px; border:1.5px solid #e8e8e4; border-radius:10px; padding:10px 6px; text-align:center;
    cursor:pointer; background:#fff;
  }
  .bed-chip.occupied { background:#fdeaea; border-color:#c0392b; }
  .bed-chip .bed-emoji { font-size:18px; }
  .bed-chip .bed-label { font-size:10px; font-weight:700; margin-top:3px; color:#555; }
  .bed-chip.occupied .bed-label { color:#c0392b; }

  .mini-row { display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
  .mini-row label { font-size:11.5px; font-weight:700; color:#555; }
  .rent-input-wrap { display:flex; align-items:center; gap:6px; }
  .rent-input-wrap input {
    width:100px; padding:7px 9px; border-radius:8px; border:1.5px solid #e8e8e4; font-size:12.5px;
    font-family:'Plus Jakarta Sans',sans-serif;
  }

  .washroom-toggle { display:flex; align-items:center; gap:6px; }

  .find-btn {
    width:100%; background:#0f7b6c; color:#fff; border:none; border-radius:12px; padding:15px;
    font-size:15px; font-weight:800; cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif; margin-top:6px;
  }
  .find-btn:disabled { opacity:0.5; cursor:not-allowed; }

  .results-room-header {
    font-size:13.5px; font-weight:800; margin:20px 0 10px; padding-bottom:8px; border-bottom:2px solid #0f7b6c;
    display:flex; justify-content:space-between; align-items:center;
  }
  .match-card {
    background:#fff; border:1.5px solid #e8e8e4; border-radius:12px; padding:14px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
  }
  .match-info { flex:1; min-width:0; }
  .match-budget { font-size:14.5px; font-weight:800; color:#0f7b6c; }
  .match-meta { font-size:11.5px; color:#888; margin-top:3px; }
  .match-desc { font-size:11.5px; color:#555; margin-top:5px; line-height:1.4; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .match-btn { flex-shrink:0; background:#0f7b6c; color:#fff; border-radius:8px; padding:9px 13px; font-size:12px; font-weight:700; text-decoration:none; white-space:nowrap; }
  .no-matches { font-size:12.5px; color:#888; padding:14px; text-align:center; background:#f7f7f5; border-radius:10px; }
  .fit-badge { display:inline-block; font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:20px; margin-left:6px; }
  .fit-great { background:#e8f5f3; color:#0f7b6c; }
  .fit-ok { background:#fef6e4; color:#a06c00; }

  footer { text-align:center; padding:24px 16px; font-size:12px; color:#999; }
  footer a { color:#0f7b6c; text-decoration:none; }
</style>
</head>
<body>

<header class="topbar">
  <a href="/" class="logo">Flat<span>Khoj</span></a>
</header>

<div class="hero">
  <div class="hero-badge">New Tool</div>
  <h1>Room Matcher</h1>
  <p>Tap open a room, mark it vacant, and tell us how it's shared — we'll find real people already looking for exactly that.</p>
</div>

<div class="section">
  <div class="setup-card">
    <div class="form-row three">
      <div class="form-group">
        <label>Area</label>
        <input type="text" id="rm-area" placeholder="e.g. Andheri West">
      </div>
      <div class="form-group">
        <label>Flat Type</label>
        <select id="rm-flat-type" onchange="rebuildHouse()">
          <option value="1">1 BHK</option>
          <option value="2" selected>2 BHK</option>
          <option value="3">3 BHK</option>
          <option value="4">4 BHK</option>
        </select>
      </div>
      <div class="form-group">
        <label>Total Rent (₹)</label>
        <input type="number" id="rm-total-rent" placeholder="60000" min="0" oninput="onTotalRentChange()">
      </div>
    </div>
  </div>

  <div class="house-wrap">
    <div class="roof"></div>
    <div class="house-body" id="house-body"></div>
  </div>

  <button class="find-btn" id="rm-find-btn" onclick="findMatches()" style="margin-top:16px">🔍 Find Potential Occupants</button>

  <div id="rm-results"></div>
</div>

<footer>
  <a href="/">Home</a> · <a href="/post_form.html">Post Free</a> · <a href="/broker_poster.html">For Brokers</a> · <a href="/privacy.html">Privacy</a>
  <br>flatkhoj.com · Mumbai's Flat &amp; Flatmate Marketplace
</footer>

<script>
const SUPA_URL = "https://hbvdboxyppsmcuqgbpwp.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhidmRib3h5cHBzbWN1cWdicHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNTIxMzUsImV4cCI6MjA4OTcyODEzNX0.h0qTsmhwSUBREHfHUx-Wxdkk12Tg58qnVwwkb-AHui4";

function normKey(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

function occupancyKeywords(occupancy) {
  if (occupancy === 'Single Room') return ['single'];
  if (occupancy === 'Double Sharing') return ['double'];
  if (occupancy === 'Triple Sharing') return ['triple'];
  return null; // Any
}
function bedCount(occupancy) {
  if (occupancy === 'Single Room') return 1;
  if (occupancy === 'Double Sharing') return 2;
  if (occupancy === 'Triple Sharing') return 3;
  return 1; // Any -- one flexible slot
}
function perBedRent(roomRent, occupancy) {
  if (!roomRent) return null;
  if (occupancy === 'Single Room') return roomRent;
  if (occupancy === 'Double Sharing') return Math.round(roomRent / 2);
  if (occupancy === 'Triple Sharing') return Math.round(roomRent / 3);
  return roomRent;
}

// ---- State ----
let rooms = [];

function buildRoomUnits(bhkCount) {
  const units = [{ id: 1, type: 'Hall', name: 'Hall', icon: '🛋️' }];
  for (let i = 1; i <= bhkCount; i++) {
    units.push({ id: units.length + 1, type: 'Bedroom', name: 'Bedroom ' + i, icon: '🚪' });
  }
  units.push({ id: units.length + 1, type: 'Kitchen', name: 'Kitchen', icon: '🍳' });
  return units.map(u => ({
    ...u,
    vacant: false,
    occupancy: 'Single Room',
    rent: null,
    washroom: true,
    beds: [{ occupied: false }],
    open: false,
  }));
}

function rebuildHouse() {
  const bhk = parseInt(document.getElementById('rm-flat-type').value);
  rooms = buildRoomUnits(bhk);
  applyEqualRent();
  renderHouse();
}

function applyEqualRent() {
  const total = parseInt(document.getElementById('rm-total-rent').value) || 0;
  if (!total || rooms.length === 0) return;
  const share = Math.round(total / rooms.length);
  rooms.forEach(r => { r.rent = share; });
}

function onTotalRentChange() {
  applyEqualRent();
  renderHouse();
}

function toggleRoomOpen(id) {
  rooms.forEach(r => { if (r.id === id) r.open = !r.open; });
  renderHouse();
}

function toggleVacant(id, checked) {
  const room = rooms.find(r => r.id === id);
  room.vacant = checked;
  if (checked && !room.open) room.open = true;
  renderHouse();
}

function setOccupancy(id, occ) {
  const room = rooms.find(r => r.id === id);
  room.occupancy = occ;
  const count = bedCount(occ);
  const beds = [];
  for (let i = 0; i < count; i++) beds.push(room.beds[i] || { occupied: false });
  room.beds = beds;
  renderHouse();
}

function toggleBed(id, bedIdx) {
  const room = rooms.find(r => r.id === id);
  room.beds[bedIdx].occupied = !room.beds[bedIdx].occupied;
  renderHouse();
}

function setRoomRent(id, val) {
  const room = rooms.find(r => r.id === id);
  room.rent = parseInt(val) || null;
}

function toggleWashroom(id, checked) {
  const room = rooms.find(r => r.id === id);
  room.washroom = checked;
}

function renderHouse() {
  const container = document.getElementById('house-body');
  container.innerHTML = rooms.map(room => {
    const bedsHtml = room.beds.map((bed, idx) => `
      <div class="bed-chip ${bed.occupied ? 'occupied' : ''}" onclick="toggleBed(${room.id},${idx})">
        <div class="bed-emoji">${bed.occupied ? '🚫' : '🛏️'}</div>
        <div class="bed-label">${bed.occupied ? 'Occupied' : 'Vacant'}</div>
      </div>`).join('');

    const occButtons = ['Single Room', 'Double Sharing', 'Triple Sharing', 'Any'].map(o => {
      const label = o === 'Single Room' ? 'Single' : o === 'Double Sharing' ? 'Double' : o === 'Triple Sharing' ? 'Triple' : 'Any';
      return `<button class="occ-btn ${room.occupancy === o ? 'sel' : ''}" onclick="setOccupancy(${room.id},'${o}')">${label}</button>`;
    }).join('');

    const vacantBeds = room.beds.filter(b => !b.occupied).length;
    const subStatus = room.vacant ? `${vacantBeds} bed${vacantBeds !== 1 ? 's' : ''} vacant · ${room.occupancy === 'Any' ? 'Any sharing' : room.occupancy.replace(' Room','').replace(' Sharing',' sharing')}` : '';

    return `
      <div class="room-unit">
        <div class="room-header ${room.vacant ? 'is-vacant' : ''}" onclick="toggleRoomOpen(${room.id})">
          <div class="room-header-left">
            <span class="room-icon">${room.icon}</span>
            <div>
              <div class="room-name">${room.name}</div>
              ${subStatus ? `<div class="room-substatus">${subStatus}</div>` : ''}
            </div>
          </div>
          <div class="vacant-toggle" onclick="event.stopPropagation()">
            Vacant
            <label class="switch">
              <input type="checkbox" ${room.vacant ? 'checked' : ''} onchange="toggleVacant(${room.id}, this.checked)">
              <span class="slider"></span>
            </label>
          </div>
        </div>
        <div class="room-details ${room.open && room.vacant ? 'open' : ''}">
          <div style="font-size:11px;font-weight:700;color:#555;margin-top:8px">Sharing Type</div>
          <div class="occ-grid">${occButtons}</div>
          <div style="font-size:11px;font-weight:700;color:#555;margin-bottom:4px">Beds — tap to mark occupied</div>
          <div class="beds-row">${bedsHtml}</div>
          <div class="mini-row">
            <label>Rent for this room (₹)</label>
            <div class="rent-input-wrap">
              <input type="number" value="${room.rent || ''}" oninput="setRoomRent(${room.id}, this.value)">
            </div>
          </div>
          <div class="mini-row">
            <div class="washroom-toggle">
              <label>🚿 Washroom Available</label>
            </div>
            <label class="switch">
              <input type="checkbox" ${room.washroom ? 'checked' : ''} onchange="toggleWashroom(${room.id}, this.checked)">
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>`;
  }).join('');
}

// ---- Matching (per vacant bed, not just per room) ----
async function findMatches() {
  const area = document.getElementById('rm-area').value.trim();
  const vacantSlots = [];
  rooms.filter(r => r.vacant).forEach(room => {
    const vacantBedCount = room.beds.filter(b => !b.occupied).length;
    if (vacantBedCount > 0) {
      vacantSlots.push({ roomName: room.name, occupancy: room.occupancy, rent: perBedRent(room.rent, room.occupancy), vacantBedCount });
    }
  });

  if (!area) { alert('Please enter the property area.'); return; }
  if (vacantSlots.length === 0) { alert('Please mark at least one room as Vacant with at least one open bed.'); return; }

  const btn = document.getElementById('rm-find-btn');
  btn.disabled = true;
  btn.textContent = 'Searching…';
  document.getElementById('rm-results').innerHTML = '<div class="no-matches">Searching live listings…</div>';

  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/listings?listing_type=eq.flatmate_wanted&is_active=eq.true&select=id,areas,room_type,rent_amount,description,gender_preference,created_at`, {
      headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` }
    });
    const allSeekers = await res.json();
    const areaKey = normKey(area);

    let resultsHtml = '';

    vacantSlots.forEach(slot => {
      const keywords = occupancyKeywords(slot.occupancy);

      let matches = allSeekers.filter(l => {
        const listingAreas = Array.isArray(l.areas) ? l.areas : [l.areas];
        const areaMatch = listingAreas.some(a => {
          const k = normKey(a);
          return k && (k === areaKey || areaKey.includes(k) || k.includes(areaKey));
        });
        if (!areaMatch) return false;
        if (keywords) {
          const roomTypeLower = (l.room_type || '').toLowerCase();
          if (!keywords.some(k => roomTypeLower.includes(k))) return false;
        }
        return true;
      });

      if (slot.rent) {
        matches.sort((a, b) => Math.abs((a.rent_amount || 0) - slot.rent) - Math.abs((b.rent_amount || 0) - slot.rent));
      } else {
        matches.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      }
      matches = matches.slice(0, 10);

      const occLabel = slot.occupancy === 'Any' ? 'Any sharing' : slot.occupancy;
      resultsHtml += `<div class="results-room-header"><span>${slot.roomName} — ${occLabel} (${slot.vacantBedCount} vacant)</span><span style="font-size:11.5px;color:#888;font-weight:600">${matches.length} match${matches.length !== 1 ? 'es' : ''}</span></div>`;

      if (matches.length === 0) {
        resultsHtml += `<div class="no-matches">No current listings match this yet. Check back soon, or widen the budget/area.</div>`;
      } else {
        matches.forEach(m => {
          const rent = m.rent_amount ? `₹${Number(m.rent_amount).toLocaleString('en-IN')}` : 'Budget not specified';
          let fitBadge = '';
          if (slot.rent && m.rent_amount) {
            const diff = Math.abs(m.rent_amount - slot.rent) / slot.rent;
            fitBadge = diff <= 0.15 ? '<span class="fit-badge fit-great">Great fit</span>' : diff <= 0.35 ? '<span class="fit-badge fit-ok">Close fit</span>' : '';
          }
          const gender = m.gender_preference ? ` · ${m.gender_preference}` : '';
          const desc = m.description ? m.description.slice(0, 100) : '';
          resultsHtml += `
            <div class="match-card">
              <div class="match-info">
                <div class="match-budget">${rent}${fitBadge}</div>
                <div class="match-meta">${m.room_type || ''}${gender}</div>
                ${desc ? `<div class="match-desc">${desc}</div>` : ''}
              </div>
              <a href="/listing_detail.html?id=${m.id}" target="_blank" class="match-btn">View & Contact</a>
            </div>`;
        });
      }
    });

    document.getElementById('rm-results').innerHTML = resultsHtml;
  } catch (err) {
    console.error('Room matcher error:', err);
    document.getElementById('rm-results').innerHTML = '<div class="no-matches">Something went wrong searching. Please try again.</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = '🔍 Find Potential Occupants';
  }
}

// Start with 2 BHK by default
rebuildHouse();
</script>

</body>
</html>
