function rmAreaSearch(inputEl) {
  const dd = document.getElementById('rmAreaDd');
  const val = inputEl.value || '';
  let results;
  if (val.length === 0) {
    results = ["Andheri West","Andheri East","Bandra West","Powai","Thane West","Lower Parel","Malad West","Goregaon West","Kandivali West","Borivali West","Worli","Dadar West","Chembur","Mulund West","Vikhroli West","Ghatkopar West"];
  } else {
    const query = val.toLowerCase();
    const matches = RM_AREAS.filter(a => a.toLowerCase().includes(query));
    // Rank relative to THIS query specifically -- exact match, then East/West
    // of the query, then a whole-word match, then any other substring match
    // last. This avoids an unrelated area (e.g. "Kharghar") outranking the
    // actual area someone typed (e.g. "Khar") just because of where it sits
    // in the master list's own alphabetical ordering.
    function rank(a) {
      const al = a.toLowerCase();
      if (al === query) return 0;
      if (al === query + ' east' || al === query + ' west') return 1;
      var esc = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      if (new RegExp('\\b' + esc + '\\b').test(al)) return 2;
      return 3;
    }
    results = matches
      .map(a => ({ a, r: rank(a) }))
      .sort((x, y) => x.r - y.r || x.a.length - y.a.length)
      .map(x => x.a)
      .slice(0, 40);
  }
  if (results.length === 0) {
    dd.innerHTML = '<div class="rm-area-empty">No matching area found</div>';
  } else {
    dd.innerHTML = results.map(a => {
      const label = val.length > 0
        ? a.replace(new RegExp('(' + val.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<span class="match">$1</span>')
        : a;
      return `<div class="rm-area-option" onclick="rmSelectArea('${a.replace(/'/g, "\\'")}')"><span>📍</span>${label}</div>`;
    }).join('');
  }
  dd.classList.add('open');
}

});

function occupancyKeywords(occupancy) {
  if (occupancy === 'Single Room') return ['single'];
  if (occupancy === 'Double Sharing') return ['double'];
  if (occupancy === 'Triple Sharing') return ['triple'];
  return null; // Any
}

// Each bed now carries its own occupancy "groupType", vacancy state, and
// rent -- rent lives on the bed, not the room. For "Any", a room offers a
// single bed OR a double-sharing pair, shown separated by "Or".
function generateBeds(occupancy) {
  if (occupancy === 'Single Room') return [{ groupType: 'Single Room', vacant: true, rent: null }];
  if (occupancy === 'Double Sharing') return [
    { groupType: 'Double Sharing', vacant: true, rent: null },
    { groupType: 'Double Sharing', vacant: true, rent: null },
  ];
  if (occupancy === 'Triple Sharing') return [
    { groupType: 'Triple Sharing', vacant: true, rent: null },
    { groupType: 'Triple Sharing', vacant: true, rent: null },
    { groupType: 'Triple Sharing', vacant: true, rent: null },
  ];
  return [
    { groupType: 'Single Room', vacant: true, rent: null },
    { groupType: 'Double Sharing', vacant: true, rent: null },
    { groupType: 'Double Sharing', vacant: true, rent: null },
  ];
}

let rooms = [];

function buildRoomUnits(bhkCount) {
  const units = [{ id: 1, type: 'Hall', name: 'Hall', icon: '🛋️' }];
  for (let i = 1; i <= bhkCount; i++) {
    units.push({ id: units.length + 1, type: 'Bedroom', name: 'Bedroom ' + i, icon: '🚪' });
  }
  units.push({ id: units.length + 1, type: 'Kitchen', name: 'Kitchen', icon: '🍳' });
  return units.map(u => ({
    ...u,
    vacant: false,
    occupancy: 'Single Room',
    beds: generateBeds('Single Room'),
    open: false,
  }));
}

function rebuildHouse() {
  const bhk = parseInt(document.getElementById('rm-flat-type').value);
  rooms = buildRoomUnits(bhk);
  renderHouse();
}

function toggleRoomOpen(id) {
  rooms.forEach(r => { if (r.id === id) r.open = !r.open; });
  renderHouse();
}

function toggleVacant(id, checked) {
  const room = rooms.find(r => r.id === id);
  room.vacant = checked;
  if (checked && !room.open) room.open = true;
  renderHouse();
}

function setOccupancy(id, occ) {
  const room = rooms.find(r => r.id === id);
  room.occupancy = occ;
  room.beds = generateBeds(occ);
  renderHouse();
}

function toggleBedVacant(id, bedIdx, checked) {
  const room = rooms.find(r => r.id === id);
  room.beds[bedIdx].vacant = checked;
  renderHouse();
}

function setBedRent(id, bedIdx, val) {
  const room = rooms.find(r => r.id === id);
  room.beds[bedIdx].rent = parseInt(val) || null;
}

function renderHouse() {
  const container = document.getElementById('house-body');
  container.innerHTML = rooms.map(room => {
    // Kitchen never gets vacancy/bed controls at all -- just shown as a
    // plain, non-interactive room in the house.
    if (room.type === 'Kitchen') {
      return `
        <div class="room-unit">
          <div class="room-header">
            <div class="room-header-left">
              <span class="room-icon">${room.icon}</span>
              <div class="room-name">${room.name}</div>
            </div>
          </div>
        </div>`;
    }

    let bedsHtml = '';
    let prevGroupType = null;
    room.beds.forEach((bed, idx) => {
      if (prevGroupType !== null && bed.groupType !== prevGroupType) {
        bedsHtml += `<div class="or-divider">Or</div>`;
      }
      const shortLabel = bed.groupType === 'Single Room' ? 'Single bed' : bed.groupType === 'Double Sharing' ? 'Double bed' : 'Triple bed';
      bedsHtml += `
        <div class="bed-card">
          <div class="bed-card-top">
            <div class="bed-card-label">🛏️ ${shortLabel}</div>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:11px;font-weight:500;color:#999">Available</span>
              <label class="switch">
                <input type="checkbox" ${bed.vacant ? 'checked' : ''} onchange="toggleBedVacant(${room.id},${idx},this.checked)">
                <span class="slider"></span>
              </label>
            </div>
          </div>
          <input type="number" class="bed-rent-input" placeholder="Enter rent for this bed (₹)" value="${bed.rent || ''}" oninput="setBedRent(${room.id},${idx},this.value)" ${bed.vacant ? '' : 'disabled'} style="${bed.vacant ? '' : 'background:#f0f0f0;color:#aaa;cursor:not-allowed'}">
        </div>`;
      prevGroupType = bed.groupType;
    });

    const occButtons = ['Single Room', 'Double Sharing', 'Triple Sharing', 'Any'].map(o => {
      const label = o === 'Single Room' ? 'Single' : o === 'Double Sharing' ? 'Double' : o === 'Triple Sharing' ? 'Triple' : 'Any';
      return `<button class="occ-btn ${room.occupancy === o ? 'sel' : ''}" onclick="setOccupancy(${room.id},'${o}')">${label}</button>`;
    }).join('');

    const vacantBeds = room.beds.filter(b => b.vacant).length;
    const subStatus = room.vacant ? `${vacantBeds} bed${vacantBeds !== 1 ? 's' : ''} vacant · ${room.occupancy === 'Any' ? 'Any sharing' : room.occupancy.replace(' Room','').replace(' Sharing',' sharing')}` : '';

    return `
      <div class="room-unit">
        <div class="room-header ${room.vacant ? 'is-vacant' : ''}" onclick="toggleRoomOpen(${room.id})">
          <div class="room-header-left">
            <span class="room-icon">${room.icon}</span>
            <div>
              <div class="room-name">${room.name}</div>
              ${subStatus ? `<div class="room-substatus">${subStatus}</div>` : ''}
            </div>
          </div>
          <div class="vacant-toggle" onclick="event.stopPropagation()">
            Vacant
            <label class="switch">
              <input type="checkbox" ${room.vacant ? 'checked' : ''} onchange="toggleVacant(${room.id}, this.checked)">
              <span class="slider"></span>
            </label>
          </div>
        </div>
        <div class="room-details ${room.open && room.vacant ? 'open' : ''}">
          <div style="font-size:11px;font-weight:700;color:#555;margin-top:8px">Sharing Type</div>
          <div class="occ-grid">${occButtons}</div>
          <div style="font-size:11px;font-weight:700;color:#555;margin:10px 0 4px">Beds</div>
          <div class="beds-row">${bedsHtml}</div>
        </div>
      </div>`;
  }).join('');
}

// ---- Matching (per vacant bed, not just per room) ----
async function findMatches() {
  const area = document.getElementById('rm-area').value.trim();
  const vacantSlots = [];
  rooms.filter(r => r.vacant).forEach(room => {
    room.beds.forEach((bed, idx) => {
      if (bed.vacant) {
        vacantSlots.push({ roomName: room.name, occupancy: bed.groupType, rent: bed.rent, bedNum: idx + 1 });
      }
    });
  });

  if (!area) { alert('Please enter the property area.'); return; }
  if (vacantSlots.length === 0) { alert('Please mark at least one room as Vacant with at least one bed left on.'); return; }

  const btn = document.getElementById('rm-find-btn');
  btn.disabled = true;
  btn.textContent = 'Searching…';
  document.getElementById('rm-results').innerHTML = '<div class="no-matches">Searching live listings…</div>';

  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/listings?listing_type=eq.flatmate_wanted&is_active=eq.true&select=id,areas,room_type,rent_amount,description,gender_preference,created_at`, {
      headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` }
    });
    const allSeekers = await res.json();
    const areaKey = normKey(area);

    let resultsHtml = '';

    vacantSlots.forEach(slot => {
      const keywords = occupancyKeywords(slot.occupancy);

      let matches = allSeekers.filter(l => {
        const listingAreas = Array.isArray(l.areas) ? l.areas : [l.areas];
        const areaMatch = listingAreas.some(a => {
          const k = normKey(a);
          return k && (k === areaKey || areaKey.includes(k) || k.includes(areaKey));
        });
        if (!areaMatch) return false;
        if (keywords) {
          const roomTypeLower = (l.room_type || '').toLowerCase();
          if (!keywords.some(k => roomTypeLower.includes(k))) return false;
        }
        return true;
      });

      if (slot.rent) {
        matches.sort((a, b) => Math.abs((a.rent_amount || 0) - slot.rent) - Math.abs((b.rent_amount || 0) - slot.rent));
      } else {
        matches.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      }
      matches = matches.slice(0, 10);

      const occLabel = slot.occupancy;
      resultsHtml += `<div class="results-room-header"><span>${slot.roomName} — ${occLabel} (Bed ${slot.bedNum})</span><span style="font-size:11.5px;color:#888;font-weight:600">${matches.length} match${matches.length !== 1 ? 'es' : ''}</span></div>`;

      if (matches.length === 0) {
        resultsHtml += `<div class="no-matches">No current listings match this yet. Check back soon, or widen the budget/area.</div>`;
      } else {
        matches.forEach(m => {
          const rent = m.rent_amount ? `₹${Number(m.rent_amount).toLocaleString('en-IN')}` : 'Budget not specified';
          let fitBadge = '';
          if (slot.rent && m.rent_amount) {
            const diff = Math.abs(m.rent_amount - slot.rent) / slot.rent;
            fitBadge = diff <= 0.15 ? '<span class="fit-badge fit-great">Great fit</span>' : diff <= 0.35 ? '<span class="fit-badge fit-ok">Close fit</span>' : '';
          }
          const gender = m.gender_preference ? ` · ${m.gender_preference}` : '';
          const desc = m.description ? m.description.slice(0, 100) : '';
          resultsHtml += `
            <div class="match-card">
              <div class="match-info">
                <div class="match-budget">${rent}${fitBadge}</div>
                <div class="match-meta">${m.room_type || ''}${gender}</div>
                ${desc ? `<div class="match-desc">${desc}</div>` : ''}
              </div>
              <a href="/listing_detail.html?id=${m.id}" target="_blank" class="match-btn">View & Contact</a>
            </div>`;
        });
      }
    });

    document.getElementById('rm-results').innerHTML = resultsHtml;
  } catch (err) {
    console.error('Room matcher error:', err);
    document.getElementById('rm-results').innerHTML = '<div class="no-matches">Something went wrong searching. Please try again.</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = '🔍 Find Potential Occupants';
  }
}

// Start with 2 BHK by default
rebuildHouse();
</script>
