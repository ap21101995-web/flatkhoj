<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Saved Listings — FlatKhoj</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#fff; --bg2:#f7f7f5; --bg3:#f0efec;
  --ink:#141414; --ink2:#444; --ink3:#888; --border:#e8e8e4;
  --teal:#0f7b6c; --teal-bg:#e8f5f3;
  --gold:#e6a817; --gold-bg:#fef6e4;
  --red:#d93025; --red-bg:#fce8e6;
  --radius:14px; --font:'Plus Jakarta Sans',sans-serif;
}
body { font-family:var(--font); background:var(--bg2); color:var(--ink); max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:80px; }
.topbar { display:flex; align-items:center; padding:0 16px; height:52px; background:var(--bg); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
.back-btn { background:none; border:none; cursor:pointer; color:var(--ink2); font-size:22px; padding:4px; margin-right:12px; }
.topbar-title { flex:1; font-size:16px; font-weight:700; }
.listing-card { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); margin:12px 16px; padding:14px 16px; cursor:pointer; position:relative; }
.listing-card:active { background:var(--bg2); }
.type-label { font-size:11px; font-weight:700; color:var(--teal); text-transform:uppercase; letter-spacing:0.3px; margin-bottom:4px; }
.card-title { font-size:15px; font-weight:700; color:var(--ink); margin-bottom:6px; line-height:1.3; }
.card-meta { font-size:12px; color:var(--ink3); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.unsave-btn { position:absolute; top:12px; right:12px; background:var(--gold-bg); border:1px solid var(--gold); border-radius:8px; padding:6px 10px; font-size:12px; font-weight:600; color:var(--gold); cursor:pointer; }
.empty-state { text-align:center; padding:60px 20px; }
.empty-icon { font-size:56px; margin-bottom:16px; }
.empty-title { font-size:18px; font-weight:700; color:var(--ink); margin-bottom:8px; }
.empty-sub { font-size:14px; color:var(--ink3); margin-bottom:24px; line-height:1.6; }
.empty-btn { display:inline-block; background:var(--teal); color:white; border:none; border-radius:12px; padding:13px 28px; font-family:var(--font); font-size:15px; font-weight:700; cursor:pointer; text-decoration:none; }
.bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--bg); border-top:1px solid var(--border); display:flex; z-index:100; }
.nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 4px 8px; background:none; border:none; cursor:pointer; font-family:var(--font); font-size:10px; font-weight:600; color:var(--ink3); }
.nav-item.active { color:var(--teal); }
</style>
</head>
<body>
<header class="topbar">
  <button class="back-btn" onclick="window.location.href='index.html'">←</button>
  <div class="topbar-title">Saved Listings</div>
</header>

<div id="savedWrap" style="padding-top:8px">
  <div style="text-align:center;padding:40px;color:var(--ink3);font-size:14px">Loading…</div>
</div>

<nav class="bottom-nav">
  <button class="nav-item" onclick="window.location.href='index.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Home
  </button>
  <button class="nav-item" onclick="window.location.href='post_form.html'">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
    Post
  </button>
  <button class="nav-item active">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    Saved
  </button>
  <button class="nav-item" onclick="window.location.href='support.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    Support
  </button>
  <button class="nav-item" onclick="window.location.href='activity.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    My Activity
  </button>
</nav>

<script>
const SUPA_URL = 'https://hbvdboxyppsmcuqgbpwp.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhidmRib3h5cHBzbWN1cWdicHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNTIxMzUsImV4cCI6MjA4OTcyODEzNX0.h0qTsmhwSUBREHfHUx-Wxdkk12Tg58qnVwwkb-AHui4';
function getUser() { try { return JSON.parse(localStorage.getItem('fmh_user')); } catch(e) { return null; } }
const typeLabels = { flat_listing:'🏠 Flat Listing', flat_wanted:'🔍 Flat Wanted', flatmate_wanted:'👥 Flatmate Wanted', pg_listing:'🏨 PG Listing' };

window.onload = async function() {
  const user = getUser();
  if (!user) { window.location.href = 'login.html?trigger=account'; return; }

  const wrap = document.getElementById('savedWrap');
  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/saved_listings?user_id=eq.${user.userId}&order=created_at.desc&select=*,listings(*)`, {
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
    });
    const saved = await res.json();

    if (!Array.isArray(saved) || saved.length === 0) {
      wrap.innerHTML = `<div class="empty-state">
        <div class="empty-icon">🔖</div>
        <div class="empty-title">No saved listings</div>
        <div class="empty-sub">Tap the bookmark icon on any listing to save it for later.</div>
        <a href="index.html" class="empty-btn">Browse listings →</a>
      </div>`;
      return;
    }

    wrap.innerHTML = '';
    saved.forEach(s => {
      const l = s.listings;
      if (!l) return;
      const areas = Array.isArray(l.areas) ? l.areas.join(', ') : l.areas || 'Mumbai';
      const div = document.createElement('div');
      div.className = 'listing-card';
      div.innerHTML = `
        <div class="type-label">${typeLabels[l.listing_type] || l.listing_type}</div>
        <div class="card-title">${l.description?.slice(0,80) || 'Listing in ' + areas}</div>
        <div class="card-meta">
          <span>📍 ${areas}</span>
          ${l.rent_amount ? `<span>₹${l.rent_amount.toLocaleString('en-IN')}/mo</span>` : ''}
          <span style="color:${l.is_active ? 'var(--teal)' : 'var(--red)'}">${l.is_active ? '● Live' : '● Expired'}</span>
        </div>
        <button class="unsave-btn" onclick="unsave(event, '${s.listing_id}', this)">🔖 Saved</button>
      `;
      div.onclick = () => window.location.href = `listing_detail.html?id=${l.id}`;
      wrap.appendChild(div);
    });
  } catch(e) {
    wrap.innerHTML = '<div style="padding:40px;text-align:center;color:var(--ink3)">Could not load saved listings</div>';
  }
};

async function unsave(e, listingId, btn) {
  e.stopPropagation();
  const user = getUser();
  if (!user) return;
  try {
    await fetch(`${SUPA_URL}/rest/v1/saved_listings?user_id=eq.${user.userId}&listing_id=eq.${listingId}`, {
      method: 'DELETE',
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
    });
    btn.closest('.listing-card').remove();
    if (document.querySelectorAll('.listing-card').length === 0) {
      document.getElementById('savedWrap').innerHTML = `<div class="empty-state">
        <div class="empty-icon">🔖</div>
        <div class="empty-title">No saved listings</div>
        <div class="empty-sub">Tap the bookmark icon on any listing to save it for later.</div>
        <a href="index.html" class="empty-btn">Browse listings →</a>
      </div>`;
    }
  } catch(e) { alert('Failed to unsave. Please try again.'); }
}
</script>
</body>
</html>
